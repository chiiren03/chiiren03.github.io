<p class="auto-style1">
<span class="auto-style2" style="font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial; display: inline !important; float: none;">
那我問你，你是男的女的？如果你是女的，你說這樣的話，那我問你，你是女孩子，那我問你，那你頭頂是不是尖的？那我問你，你頭頂是尖的呢，還是禿頂的，嗯？還是染黃色染紅色的呢？那我問你，還是帶假髮的？如果你是男的，那我問你，你說我頭是尖的，嗯？那我問你，那你是不是禿頭？那你是不是光頭？嗯？你是光頭還是有頭髮的？嗯？那我問你，我頭尖怎麼了？我就尖怎樣了？哎我就尖怎麼了？我就頭頂尖怎麼了？哎我頭頂尖，難道你看不慣嗎？送客！</span></p>
